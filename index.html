<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5周年特別 寿司懐石｜ご予約状況</title>
<style>
*{box-sizing:border-box}
body{font-family:-apple-system,BlinkMacSystemFont,"Hiragino Kaku Gothic ProN","Yu Gothic",sans-serif;margin:0;background:#f7f6f2;color:#333}
.container{max-width:620px;margin:0 auto;padding:32px 20px 50px}
h1{font-size:28px;text-align:center;margin:0 0 10px}
.lead{text-align:center;font-size:18px;line-height:1.8;margin:0 0 28px}
.legend{background:#fff;border-radius:12px;padding:16px;text-align:center;font-size:18px;line-height:2.1;margin-bottom:25px}
.closed-note{display:block;margin-top:8px;font-size:14px;line-height:1.6;color:#666}
.month{background:#fff;border-radius:14px;padding:20px 12px;margin-bottom:20px}
h2{text-align:center;font-size:24px;margin:0 0 15px}
.date{display:grid;grid-template-columns:155px 165px;justify-content:center;align-items:center;gap:12px;border-top:1px solid #eee;padding:14px 4px;font-size:19px}
.date:first-of-type{border-top:none}
.status{font-weight:bold;text-align:left}
.saturday{color:#52759a}
.sunday,.holiday{color:#a85f5f}
.note{font-size:16px;margin-top:4px;color:#555}
.footer{margin-top:30px;text-align:center;font-size:18px;line-height:2}
@media(max-width:390px){.date{grid-template-columns:140px 150px;gap:8px;font-size:18px}.status{font-size:17px}}
</style>
</head>
<body>
<div class="container">
<h1>🍣 5周年特別 寿司懐石</h1>
<p class="lead">10月・11月限定</p>
<div class="legend"><strong>ご予約受付は終了いたしました。</strong><br>たくさんのご予約をいただき、誠にありがとうございました。</div>
</div>
</body>
</html>
